name: Fetch VPN Gate List
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    steps:
      # Use the latest versions that support Node.js 24
      - name: Checkout repository
        uses: actions/checkout@v4  # Latest version supports Node.js 24

      - name: Download VPN server list
        run: |
          curl -o vpn_servers.txt https://www.vpngate.net/api/iphone/

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5  # Latest version supports Node.js 24
        with:
          commit_message: "Automated update of VPN server list"
          file_pattern: 'vpn_servers.txt'
