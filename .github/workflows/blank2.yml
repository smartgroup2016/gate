name: Fetch VPN Gate List

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Optional: Silence Node.js warnings

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required for pushing changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download VPN server list
        run: |
          echo "Downloading from VPN Gate API..."
          curl -o vpn_servers.txt https://www.vpngate.net/api/iphone/
          echo "File downloaded successfully. Size: $(wc -c < vpn_servers.txt) bytes"
      
      - name: Commit and push changes
        run: |
          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if the file has changed
          if git diff --quiet vpn_servers.txt; then
            echo "No changes detected. Skipping commit."
          #  exit 0
          fi
          
          # Stage, commit, and push
          git add vpn_servers.txt
          git commit -m "Automated update of VPN server list [skip ci]"
          git push
          
          echo "Changes committed and pushed successfully."
